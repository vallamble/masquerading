# navi deployment (Docker Swarm + Portainer), exposed through Traefik.
# Traefik (Swarm mode, traefik_public network, websecure entrypoint, resolver "le")
# terminates TLS and routes Host(masquerading.lamble.fr) → container:8080.
# No port published on the host: traffic goes through Traefik only
# (LAN via Pi-hole → navi:443; Internet via the Cloudflare tunnel → Traefik).
services:
  masquerading:
    image: ghcr.io/vallamble/masquerading:latest
    volumes:
      - masquerading_data:/data
    # Existing Swarm secrets (Portainer → Secrets), mounted at /run/secrets/<name>; the application reads
    # <VAR>_FILE (Docker convention). No secret value in this file nor in the stack variables.
    secrets:
      - SERVICE_API_KEY
      - GRAPH_TENANT_ID
      - GRAPH_CLIENT_ID
      - GRAPH_CLIENT_SECRET
    environment:
      # --- Service auth (X-Api-Key header expected from the Securiti workflows) ---
      SERVICE_API_KEY_FILE: /run/secrets/SERVICE_API_KEY
      # --- Microsoft Graph app-only (Entra app, Sites.Selected on the root site) ---
      GRAPH_TENANT_ID_FILE: /run/secrets/GRAPH_TENANT_ID
      GRAPH_CLIENT_ID_FILE: /run/secrets/GRAPH_CLIENT_ID
      GRAPH_CLIENT_SECRET_FILE: /run/secrets/GRAPH_CLIENT_SECRET
      # fallback trigger (scan-completion poller): create the three Swarm secrets, mount them below, then set the id
      # SECURITI_POLL_DATASOURCE: "102"
      # SECURITI_TENANT_ID_FILE: /run/secrets/SECURITI_TENANT_ID
      # SECURITI_API_KEY_FILE: /run/secrets/SECURITI_API_KEY
      # SECURITI_API_SECRET_FILE: /run/secrets/SECURITI_API_SECRET
      # --- SharePoint target (tenant root site → empty SP_SITE_PATH) ---
      SP_HOSTNAME: "m365x42057173.sharepoint.com"
      SP_SITE_PATH: ""
      SP_LIBRARY: "Documents"
      # --- State paths (the volume already contains /data/mapping_by_value.csv) ---
      DATA_DIR: "/data"
      INBOUND_PREFIX: "Documents/Inbound"
      OUTPUT_PREFIX: "Documents/Output"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - traefik_public
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.masquerading.rule=Host(`masquerading.lamble.fr`)"
        - "traefik.http.routers.masquerading.entrypoints=websecure"
        - "traefik.http.routers.masquerading.tls=true"
        - "traefik.http.routers.masquerading.tls.certresolver=le"
        # In Swarm mode, the container target port is mandatory as a label.
        - "traefik.http.services.masquerading.loadbalancer.server.port=8080"

secrets:
  SERVICE_API_KEY:
    external: true
  GRAPH_TENANT_ID:
    external: true
  GRAPH_CLIENT_ID:
    external: true
  GRAPH_CLIENT_SECRET:
    external: true

volumes:
  masquerading_data:
    external: true

networks:
  traefik_public:
    external: true
