# Déploiement navi (Docker Swarm + Portainer), exposé via Traefik.
# Traefik (mode Swarm, réseau traefik_public, entrypoint websecure, resolver "le")
# termine le TLS et route Host(masquerading.lamble.fr) → conteneur:8080.
# Pas de port publié sur l'hôte : le trafic passe uniquement par Traefik
# (LAN via Pi-hole → navi:443 ; Internet via le tunnel Cloudflare → Traefik).
services:
  masquerading:
    image: ghcr.io/vallamble/masquerading:latest
    volumes:
      - masquerading_data:/data
    # Secrets Swarm existants (Portainer → Secrets), montés dans /run/secrets/<nom> ; l'application lit
    # <VAR>_FILE (convention Docker). Aucune valeur secrète dans ce fichier ni dans les variables de la stack.
    secrets:
      - SERVICE_API_KEY
      - GRAPH_TENANT_ID
      - GRAPH_CLIENT_ID
      - GRAPH_CLIENT_SECRET
    environment:
      # --- Auth du service (header X-Api-Key attendu des workflows Securiti) ---
      SERVICE_API_KEY_FILE: /run/secrets/SERVICE_API_KEY
      # --- Microsoft Graph app-only (app Entra Sites.Selected sur le site racine) ---
      GRAPH_TENANT_ID_FILE: /run/secrets/GRAPH_TENANT_ID
      GRAPH_CLIENT_ID_FILE: /run/secrets/GRAPH_CLIENT_ID
      GRAPH_CLIENT_SECRET_FILE: /run/secrets/GRAPH_CLIENT_SECRET
      # --- Cible SharePoint (site racine du tenant → SP_SITE_PATH vide) ---
      SP_HOSTNAME: "m365x42057173.sharepoint.com"
      SP_SITE_PATH: ""
      SP_LIBRARY: "Documents"
      # --- Chemins d'état (le volume contient déjà /data/mapping_by_value.csv) ---
      DATA_DIR: "/data"
      INBOUND_PREFIX: "Documents/Inbound"
      OUTPUT_PREFIX: "Documents/Output"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - traefik_public
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.masquerading.rule=Host(`masquerading.lamble.fr`)"
        - "traefik.http.routers.masquerading.entrypoints=websecure"
        - "traefik.http.routers.masquerading.tls=true"
        - "traefik.http.routers.masquerading.tls.certresolver=le"
        # En mode Swarm, le port cible du conteneur est obligatoire en label.
        - "traefik.http.services.masquerading.loadbalancer.server.port=8080"

secrets:
  SERVICE_API_KEY:
    external: true
  GRAPH_TENANT_ID:
    external: true
  GRAPH_CLIENT_ID:
    external: true
  GRAPH_CLIENT_SECRET:
    external: true

volumes:
  masquerading_data:
    external: true

networks:
  traefik_public:
    external: true
